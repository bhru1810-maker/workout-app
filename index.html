<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>אימונים ונהנים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECEFEA; --surface:#F8F9F6; --sunk:#E1E5DF; --ink:#161A18; --muted:#56615B; --faint:#7F8983; --line:#CFD5CE;
  --a:#2350B5; --a-ink:#FFFFFF; --a-soft:#DCE4F6;
  --b:#E1A814; --b-ink:#1E1700; --b-soft:#F5E9C4;
  --f:#39433E; --f-ink:#FFFFFF;
  --good:#2C7A47; --good-soft:#DCEFE2; --warn:#9C4F08; --warn-soft:#F8E6D2; --bad:#B42318; --bad-soft:#FADFDB;
  --display:"Karantina","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --sans:"IBM Plex Sans Hebrew","Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1211; --surface:#171B19; --sunk:#1F2522; --ink:#E5E9E6; --muted:#9BA59F; --faint:#77817B; --line:#2B322E;
    --a:#7C9CF0; --a-ink:#0A1024; --a-soft:#1B2542;
    --b:#E8B94A; --b-ink:#1E1700; --b-soft:#372D12;
    --f:#C9D1CC; --f-ink:#111513;
    --good:#63C184; --good-soft:#15291C; --warn:#F0A55A; --warn-soft:#33230F; --bad:#F2806F; --bad-soft:#3A1813;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1211; --surface:#171B19; --sunk:#1F2522; --ink:#E5E9E6; --muted:#9BA59F; --faint:#77817B; --line:#2B322E;
  --a:#7C9CF0; --a-ink:#0A1024; --a-soft:#1B2542;
  --b:#E8B94A; --b-ink:#1E1700; --b-soft:#372D12;
  --f:#C9D1CC; --f-ink:#111513;
  --good:#63C184; --good-soft:#15291C; --warn:#F0A55A; --warn-soft:#33230F; --bad:#F2806F; --bad-soft:#3A1813;
}
/* in-page choice (auto / light / dark) wins over the host theme */
html:root[data-ui="light"]{color-scheme:light;
  --bg:#ECEFEA; --surface:#F8F9F6; --sunk:#E1E5DF; --ink:#161A18; --muted:#56615B; --faint:#7F8983; --line:#CFD5CE;
  --a:#2350B5; --a-ink:#FFFFFF; --a-soft:#DCE4F6;
  --b:#E1A814; --b-ink:#1E1700; --b-soft:#F5E9C4;
  --f:#39433E; --f-ink:#FFFFFF;
  --good:#2C7A47; --good-soft:#DCEFE2; --warn:#9C4F08; --warn-soft:#F8E6D2; --bad:#B42318; --bad-soft:#FADFDB;
}
html:root[data-ui="dark"]{color-scheme:dark;
  --bg:#0F1211; --surface:#171B19; --sunk:#1F2522; --ink:#E5E9E6; --muted:#9BA59F; --faint:#77817B; --line:#2B322E;
  --a:#7C9CF0; --a-ink:#0A1024; --a-soft:#1B2542;
  --b:#E8B94A; --b-ink:#1E1700; --b-soft:#372D12;
  --f:#C9D1CC; --f-ink:#111513;
  --good:#63C184; --good-soft:#15291C; --warn:#F0A55A; --warn-soft:#33230F; --bad:#F2806F; --bad-soft:#3A1813;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px}
.app{max-width:920px;margin-inline:auto;padding-block:20px 72px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
a{color:var(--a)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}
bdi{unicode-bidi:isolate}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-bottom:14px}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(52px,11vw,76px);line-height:.82;letter-spacing:.5px}
.brand h1 span{color:var(--a)}
.brand p{color:var(--muted);margin-top:8px;font-size:14px}
.top-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.on i{background:var(--good)}
.sync.off i{background:var(--warn)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;padding:12px 12px 10px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:hover{color:var(--ink)}

section.tab{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.h2{font-family:var(--display);font-weight:700;font-size:40px;line-height:.95;letter-spacing:.3px}
.h3{font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}

/* plates */
.plate{--p:var(--a);--pi:var(--a-ink);flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:var(--pi);font-family:var(--display);font-weight:700;font-size:23px;line-height:1;box-shadow:inset 0 0 0 4px var(--p),inset 0 0 0 5.5px color-mix(in srgb,var(--pi) 35%,transparent)}
.plate.B{--p:var(--b);--pi:var(--b-ink)}
.plate.F{--p:var(--f);--pi:var(--f-ink)}
.plate.C{--p:var(--good);--pi:#fff}
.plate.lg{width:64px;height:64px;font-size:34px;box-shadow:inset 0 0 0 6px var(--p),inset 0 0 0 8px color-mix(in srgb,var(--pi) 35%,transparent)}
.plate.sm{width:30px;height:30px;font-size:17px;box-shadow:none}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center}
.wd b{font-size:13px;color:var(--muted);font-weight:600}
.wd .rest{font-size:11.5px;color:var(--faint);line-height:1.25;min-height:30px;display:grid;place-items:center}
.wd.next{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.daypick{display:flex;gap:8px;flex-wrap:wrap}
.daypick button{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font-weight:600}
.daypick button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk)}
.daypick .plate{width:32px;height:32px;font-size:18px;box-shadow:none}
@media (max-width:620px){.daypick{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.daypick button{padding:4px;flex:none}.daypick button .lbl{display:none}}

.dayhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dayhead .t{flex:1;min-width:200px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.tag.next{background:var(--ink);color:var(--bg)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.linkbtn.bad{color:var(--bad)}

/* exercise lists */
.block{display:flex;flex-direction:column;gap:0}
.block-h{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.block-h h3{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.block-h span{color:var(--muted);font-size:13px}
.exlist{list-style:none;margin:0;padding:0}
.ex{display:grid;grid-template-columns:40px 1fr;gap:4px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.ex-no{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--muted);padding-top:2px}
.ex-no.ss{color:var(--ink)}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 14px;flex-wrap:wrap}
.ex-name{font-weight:700;font-size:16px;direction:ltr}
.rx{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap}
.ex-cue{color:var(--muted);font-size:14px;margin-top:2px;max-width:62ch}
.ex-meta{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:13px;color:var(--faint)}
.cues{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:14px;max-width:64ch}
.cues li{position:relative;padding-inline-start:14px}
.cues li::before{content:"";position:absolute;inset-inline-start:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.avoid{font-size:13.5px;color:var(--warn);margin-top:4px;max-width:64ch}
.avoid b{font-weight:700}
.vid{display:inline-flex;align-items:center;gap:8px;background:var(--a-soft);color:var(--a);font-weight:600;padding:5px 12px 5px 14px;border-radius:999px;text-decoration:none;font-size:13.5px;line-height:1.3}
.vid:hover{background:var(--a);color:var(--a-ink)}
.vid em{font-style:normal;font-weight:500;opacity:.75;font-size:12px}
.vid.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.vid.alt:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.play{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid currentColor;flex:none}
.minivid{font-size:12.5px;font-weight:600;color:var(--a);text-decoration:none;white-space:nowrap}
.minivid:hover{text-decoration:underline}
.bal{display:flex;flex-direction:column;gap:6px}
.bal-g{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.bal-row{display:grid;grid-template-columns:112px 1fr 44px 58px;gap:10px;align-items:center}
.bal-n{font-size:14px}
.bal-track{position:relative;height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bal-band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 22%,transparent);border-inline:1px dashed color-mix(in srgb,var(--good) 70%,transparent)}
.bal-bar{position:absolute;top:3px;bottom:3px;inset-inline-start:0;border-radius:0 4px 4px 0;background:var(--a)}
[dir="rtl"] .bal-bar{border-radius:4px 0 0 4px}
.bal-bar.upper{background:var(--b)}
.bal-bar.core{background:var(--f)}
.bal-v{font-family:var(--mono);font-size:13px;text-align:end}
.bal-row .tag{justify-self:start;font-size:11.5px}
@media (max-width:520px){.bal-row{grid-template-columns:92px 1fr 38px}.bal-row .tag{display:none}}
.ssmark{font-size:11.5px;font-weight:600;color:var(--ink);background:var(--sunk);border-radius:6px;padding:1px 7px}

details.fold{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.fold>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-family:var(--mono);font-size:18px;color:var(--muted)}
details.fold[open]>summary::after{content:"–"}
details.fold .inner{padding:0 18px 14px}
details.fold .ex{grid-template-columns:32px 1fr;padding:10px 0}
details.fold .ex:last-child{border-bottom:0}

ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.clean li{position:relative;padding-inline-start:18px;max-width:68ch}
ul.clean li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--ink)}
ul.clean.a li::before{background:var(--a)}
ul.clean.good li::before{background:var(--good)}
ul.clean.warn li::before{background:var(--b)}
ul.clean.bad li::before{background:var(--bad)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px}
ol.steps li::before{content:counter(s);font-family:var(--display);font-size:30px;font-weight:700;line-height:.9;color:var(--a)}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:16px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.scale{display:flex;flex-direction:column;gap:6px}
.scale .lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.scale .lbl em{font-style:normal;font-weight:400;color:var(--faint)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills label{min-width:30px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:14px;cursor:pointer;background:var(--bg);padding-inline:4px}
.pills input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pills input:focus-visible+label{outline:2px solid var(--a);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--bad)}
.alert{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--bad-soft);color:var(--bad);font-weight:500}
.note{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--sunk);color:var(--ink)}

.logex{display:grid;grid-template-columns:1fr;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.logex .hd{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;align-items:baseline}
.prev{font-size:12.5px;color:var(--faint);font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{display:flex;align-items:center;gap:4px;background:var(--sunk);border-radius:10px;padding:5px 6px}
.set span{font-family:var(--mono);font-size:12px;color:var(--muted);width:16px;text-align:center}
.set input{width:62px;padding:6px 6px;font-size:15px;text-align:center;font-family:var(--mono)}
.set i{font-style:normal;color:var(--faint);font-size:12px}

.save-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px -12px rgb(0 0 0 / .35)}

/* per-exercise options, goal, insights, timer */
.exopts{display:flex;gap:8px;flex-wrap:wrap}
.mini-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mini-seg input{position:absolute;opacity:0;pointer-events:none}
.mini-seg label{padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;background:var(--bg)}
.mini-seg input:checked+label{background:var(--ink);color:var(--bg)}
.mini-seg input:focus-visible+label{outline:2px solid var(--a);outline-offset:-2px}
.exhint{font-size:12px;color:var(--faint)}
.goal{font-size:13px;color:var(--good)}
.goal b{font-family:var(--mono);font-weight:600}
.insight{border-color:color-mix(in srgb,var(--a) 45%,var(--line))}
.timer{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0 10px}
.timer .t-lbl{font-size:13px;font-weight:700;color:var(--muted)}
.timer b{font-size:40px;font-weight:700;min-width:100px;direction:ltr;letter-spacing:1px;font-family:var(--mono)}
.timer.run b{color:var(--a)}
.timer.ring b{color:var(--good);animation:pulse .4s ease-in-out 3}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.t-q{display:flex;gap:6px;flex-wrap:wrap}
.t-q button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;min-width:56px;touch-action:manipulation}
.t-q button:hover{border-color:var(--ink);background:var(--sunk)}
.t-q button:active{background:var(--ink);color:var(--bg)}
.t-bar{position:absolute;bottom:0;inset-inline-start:0;height:3px;width:0;background:var(--a);border-radius:2px}
.timer .linkbtn{font-size:15px;padding:10px 12px}
.nextlist{display:flex;flex-direction:column}
.nx{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.nx:last-child{border-bottom:0}
.nx b{font-size:14px;font-weight:600;color:var(--good)}
.nx span{grid-column:1 / -1;font-size:12.5px;color:var(--muted)}
/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* history list */
.hist{display:flex;flex-direction:column}
.hitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:0}
.hitem .d{font-family:var(--mono);font-size:13px;color:var(--muted)}
.hitem .s{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.hitem .acts{display:flex;gap:12px}

/* stats + charts */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:44px;line-height:.95;font-weight:700}
.stat b small{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.stat span{font-size:13px;color:var(--muted)}
.chart{position:relative;direction:ltr}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-axis{fill:var(--muted);font-family:var(--mono);font-size:11px}
.ch-line{fill:none;stroke:var(--a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--a);opacity:.10}
.ch-dot{fill:var(--a);stroke:var(--surface);stroke-width:2}
.ch-end{fill:var(--ink);font-family:var(--mono);font-size:12px;font-weight:600}
.ch-cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.ch-hit{fill:transparent;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:12px;padding:5px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-120%)}
.empty{color:var(--faint);font-size:14px;padding:18px 0}

.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:88px;height:116px;border-radius:10px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgb(0 0 0 / .6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare figure{margin:0;display:flex;flex-direction:column;gap:6px}
.compare .imgs{display:flex;gap:6px;overflow-x:auto}
.compare img{height:220px;width:auto;border-radius:10px;border:1px solid var(--line)}
.compare figcaption{font-size:13px;color:var(--muted)}

.lists3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.phase{display:flex;flex-direction:column;gap:6px}
.phase .h2{font-size:44px}
.prin{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:0 28px}
.prin article{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.prin h3{font-size:16px;font-weight:700}
.prin p{color:var(--muted);font-size:14.5px;max-width:64ch}
.foot{color:var(--faint);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:20;box-shadow:0 10px 30px -10px rgb(0 0 0 / .5)}
.duebar{display:flex;justify-content:space-between;gap:10px;align-items:center}
@media (max-width:520px){
  .h2{font-size:34px}
  .panel{padding:14px}
  .wd{padding:8px 0}
  .plate.sm{width:26px;height:26px;font-size:15px}
  .compare img{height:160px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

"log":"wr"},{"id":"sprint","n":"Sprints / Assault bike","sr":"6×10–15 שנ׳","c":["מאמץ מקסימלי קצר","מנוחה מלאה בין החזרות","בחודש הראשון 80% מהמהירות"],"x":"לקצר מנוחה ולהפוך את זה לסבולת","v":"https://www.youtube.com/watch?v=NxEu6bs-2uQ","rest":"מלאה","log":"t"},{"id":"zone2","n":"Zone 2 cardio","sr":"30–40 דק׳","c":["חלופה לספרינטים: הליכה מהירה בשיפוע, אופניים או שחייה","קצב שאפשר לדבר בו במשפטים מלאים","טניס או כל משחק עם כדור נחשב"],"x":null,"v":"https://www.youtube.com/watch?v=jnHDJcOLYUI","log":"t"}]},{"t":"מוביליטי","items":[{"id":"flow","n":"Mobility flow","sr":"20 דק׳","c":["מתיחות הסיום של A ושל B ברצף, 2 סבבים","או אחד מסרטוני ה-follow along ברשימה","אפשר לסיים בסאונה"],"x":null,"v":"https://www.youtube.com/playlist?list=PL1eYPc-qNuO1Q4qPh6iorUi-5cczwjUYp","vt":"רשימת סרטונים"}]}]}],"restday":{"title":"יום מנוחה פעילה","when":"ג׳ (ושבת לפי התחושה)","items":[{"id":"r_walk","n":"הליכה בחוץ","sr":"30–45 דק׳","c":["עדיף בבוקר, באור יום","קצב נוח שאפשר לדבר בו","מזרים דם לשרירים ומסדר את השעון הביולוגי"],"x":null,"v":null},{"id":"r_mob","n":"מוביליטי קל","sr":"10 דק׳","c":["4–5 מתיחות מסוף האימון שהכי נוקשות לך","בלי מאמץ, רק טווח"],"x":null,"v":null},{"id":"r_nsdr","n":"NSDR · מנוחה עמוקה","sr":"10–20 דק׳","c":["שכיבה עם אוזניות ועיניים עצומות","מאזין להקלטה ומשחרר את הגוף","טוב במיוחד אחרי לילה קצר"],"x":null,"v":"https://www.youtube.com/watch?v=KHIbgSN2qAU"}]},"mind":["אימוני כוח מפחיתים באופן מובהק תסמינים של דיכאון וחרדה. כך עולה ממטא-אנליזה שפורסמה ב-2018 בכתב העת JAMA Psychiatry. ההתמדה חשובה יותר מהעצימות.","בסוף כל אימון: דקה-שתיים של Physiological sigh. זה מוריד את הדופק ומעביר את הגוף ממאמץ להתאוששות.","בבוקר: 10–20 דקות הליכה באור יום. מסדר את השעון הביולוגי, ומשפר שינה ומצב רוח.","פעם בשבוע משחק: טניס או כל ספורט עם אחרים. תנועה בשביל הכיף ולא בשביל מספרים.","ביום המנוחה: NSDR של 10–20 דקות בצהריים.","בצ׳ק-אין השבועי יש מצב רוח ולחץ. אם הם יורדים שבועיים ברצף, מורידים עומס לפני שמוסיפים."],"rules":["כוח (טווח של 5 חזרות): כשכל הסטים נקיים, מוסיפים 2.5 ק״ג בפלג עליון ו-5 ק״ג ברגליים.","נפח: עובדים בטווח חזרות. כשהגעת לתקרה בכל הסטים, מעלים משקל וחוזרים לתחתית הטווח.","עצימות: 1–2 חזרות לפני כשל ברוב הסטים. בתרגילי בידוד מותר להגיע לכשל בסט האחרון.","מנוחה: 2.5–3 דק׳ בתרגילי כוח, 60–90 שנ׳ בנפח ובסופרסטים.","כוח מתפרץ (קפיצות וזריקות) תמיד בתחילת האימון, כשהגוף טרי. איכות ולא עייפות.","דילואד בכל שבוע שישי: אותם משקלים, חצי מהסטים.","תרגיל שלא עלה שני אימונים ברצף: מורידים 10% ובונים מחדש."],"cues":["טווח לפני משקל. ב-ATG הטווח הוא התרגיל, והמשקל עולה רק כשהטווח מלא ונקי.","כאב חד, או כאב מעל 3 מתוך 10 בברך או בגב, עוצר את הסט. צריבה ומאמץ זה בסדר.","Tibialis, מזחלת לאחור ו-Poliquin הם מה שמכין את הברכיים לעומס. לא מדלגים עליהם.","שינה של 7.5–9 שעות. בלי זה אין מסה.","לא לוקחים משככי כאבים מסוג NSAIDs (אדוויל, נורופן, וולטרן בכדורים) לכאבי אימון. הם קשורים להתלקחויות במחלות מעי דלקתיות. לשאול את הרופא מה כן מותר.","מים ואלקטרוליטים, במיוחד אחרי סאונה ובימים עם יציאות מרובות: מים עם קורט מלח ולימון.","בזמן התלקחות: 2 אימונים בשבוע בחצי נפח, מוביליטי והליכות. חום, דם ביציאות או ירידה במשקל: פונים לגסטרואנטרולוג לפני שחוזרים לעומס.","שקילה: שלושה בקרים בשבוע (א׳, ד׳, ו׳), בצום, אחרי שירותים. בצ׳ק-אין מכניסים את הממוצע.","תמונות: כל 4 שבועות, בבוקר, בצום, באותה תאורה ובאותו מקום. חזית, צד וגב."],"adjust":["משקל: היעד הוא עלייה של 0.5–1 ק״ג בחודש. שלושה שבועות מתחת ליעד: מוסיפים כ-200 קק״ל (אורז, תפוח אדמה, שמן זית). מעל היעד והיקף המותניים עולה מהר: מורידים.","התאוששות של 4 ומטה שבועיים ברצף, או שינה מתחת ל-7 שעות: מורידים סט מכל תרגיל עד שזה חוזר.","מצב רוח או לחץ יורדים שבועיים ברצף: מורידים נפח, מוסיפים הליכות ומשחק, ובודקים שינה.","תרגיל שתקוע שני אימונים: מחליפים וריאציה או חוזרים 10% אחורה.","עיכול: נפיחות או כאב עולים ב-2 נקודות, או שינוי בצורת היציאה: חוזרים לשלב התזונה הקודם ובודקים מה נוסף לאחרונה.","בדיקות: קלפרוטקטין או CRP עולים — קודם הגסטרו. התזונה לא מחליפה טיפול.","מראה: לפי התמונות ולפי מאזן השרירים השבועי, אזור שמפגר (למשל כתפיים או ירכיים) מקבל 2–4 סטים שבועיים נוספים."],"nutrition":{"phase":"שלב 1 · בסיס נקי","weeks":"4 השבועות הראשונים","goal":"להוציא מזון מתועש, לייצב את העיכול ולבנות קו בסיס של תחושות לפני שמוסיפים מאכלים.","eat":["בשר בקר, עוף והודו טריים, לא מעובדים","דגים שמנים: סלמון, סרדינים, מקרל, 2–3 פעמים בשבוע","ביצים","אורז לבן, תפוח אדמה, בטטה","ירקות מבושלים: קישוא, גזר, דלעת, תרד, שעועית ירוקה","פירות: בננה, תפוח מבושל, אוכמניות, פפאיה","שמן זית, אבוקדו, טחינה גולמית אם נסבלת","ציר עצמות ביתי, עשבי תיבול, כורכום, ג׳ינג׳ר"],"test":["מאכל חדש אחד כל 3–4 ימים, ורושמים את התגובה בצ׳ק-אין","יוגורט או קפיר ביתי (תסיסה של 24 שעות)","כרוב כבוש, בכמות קטנה","קטניות מושרות ומבושלות היטב, קודם עדשים כתומות","אגוזים ושקדים, קודם כחמאה","שיבולת שועל","ירקות חיים וסלטים"],"avoid":["מזון אולטרה-מעובד: חטיפים, דגני בוקר, מאפים תעשייתיים","מתחלבים ומייצבים: קרבוקסימתיל צלולוז (E466), פוליסורבט 80 (E433), קרגינן (E407)","ממתיקים מלאכותיים (סוכרלוז, אספרטיים) ומלטודקסטרין","בשר מעובד: נקניקים, נקניקיות, פסטרמה","שמנים צמחיים מזוקקים וטיגון עמוק","אלכוהול ומשקאות ממותקים","אבקות חלבון עם ממתיקים וגאמים"]},"labs":[{"name":"ספירת דם (CBC) + CRP","freq":"כל 3 חודשים","m":3,"why":"דלקת ואנמיה"},{"name":"קלפרוטקטין בצואה","freq":"כל 3–6 חודשים","m":3,"why":"המדד הישיר לדלקת במעי"},{"name":"פריטין, ברזל, טרנספרין","freq":"כל 6 חודשים","m":6,"why":"מאגרי ברזל, משפיעים על אנרגיה והתאוששות"},{"name":"B12 וחומצה פולית","freq":"כל 6 חודשים","m":6,"why":"הספיגה שלהם נפגעת כשהמעי הדק מעורב"},{"name":"ויטמין D","freq":"כל 6 חודשים","m":6,"why":"עצמות, מערכת החיסון ושריר"},{"name":"אלבומין, תפקודי כבד וכליה","freq":"כל 6 חודשים","m":6,"why":"מצב תזונתי. הכליות חשובות עם חלבון גבוה וקריאטין"},{"name":"אבץ ומגנזיום","freq":"פעם בשנה","m":12,"why":"חסרים נפוצים במחלות מעי דלקתיות"},{"name":"פרופיל שומנים, HbA1c","freq":"פעם בשנה","m":12,"why":"בריאות מטבולית"},{"name":"הרכב גוף (InBody או DEXA)","freq":"כל 3 חודשים, רשות","m":3,"why":"מסת שריר מול שומן, מדויק יותר ממשקל"}],"changelog":[{"date":"2026-09-26","text":"גרסה ראשונה: 4 אימונים (A1, B1, A2, B2) ויום F אופציונלי. תזונה בשלב 1, בסיס נקי. הצ׳ק-אין הראשון קובע את נקודת הפתיחה: משקל, היקף מותניים, תמונות ומדדי עיכול."},{"date":"2026-09-27","text":"גרסה 2: לכל תרגיל יש סרטון הדגמה ישיר, 3 דגשים ו\"להימנע\". נוספו כוח מתפרץ (Box jump, זריקת כדור), Seated leg curl, Hip abduction, Farmer's carry ו-Side plank. הורחבו הכתפיים הצדדיות ל-8 סטים. נוספו יום מנוחה פעילה, פרק גוף ונפש ומאזן שרירים שבועי. יצאו Back extension, Pallof press, Dragon flag ו-Sissy squat כדי לשמור על משך אימון סביר."},{"date":"2026-09-27","text":"גרסה 3: בכל יום רגליים יש בלוק קטן של פלג עליון. A1: מתח עם משקל, לחיצת חזה במשקולות והרחקת כתפיים. A2: לחיצה בשיפוע, חתירה ביד אחת ו-Face pull. ב-B2 נוסף Back extension לרגליים. Pistol squat יצא מ-A2 ו-Overhead triceps ו-Landmine press ירדו ל-2 סטים כדי לשמור על המאזן ועל משך האימון."},{"date":"2026-09-27","text":"גרסה 4: ביומן אפשר לסמן לכל תרגיל \"משקל גוף\" ו\"צד אחד בכל פעם\". סט עם 0 חזרות לא נספר. נוספו טיימר מנוחה ותובנות אחרי כל אימון עם יעד לאימון הבא. השם שונה ל\"אימונים ונהנים\"."}]};

const T = { end: 0, total: 0, int: null, audio: null };
function restSecs(r) { if (!r) return 90; const m = String(r).match(/(\d+)/); if (!m) return 180; return /דק/.test(r) ? +m[1] * 60 : +m[1]; }
function ensureAudio() { try { if (!T.audio) T.audio = new (window.AudioContext || window.webkitAudioContext)(); if (T.audio.state === 'suspended') T.audio.resume(); } catch (e) {} }
function beep() {
  try { const a = T.audio; if (!a) return; [0, 0.35].forEach(t0 => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.25, a.currentTime + t0); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + t0 + 0.28); o.connect(g); g.connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + 0.3); }); } catch (e) {}
}
function startTimer(sec) { ensureAudio(); T.total = sec; T.end = Date.now() + sec * 1000; clearInterval(T.int); T.int = setInterval(paintTimer, 250); paintTimer(); }
function stopTimer() { clearInterval(T.int); T.end = 0; paintTimer(); }
function paintTimer() {
  const pairs = [['#t-disp', '#t-bar', '#timer'], ['#pt-disp', '#pt-bar', '#prog-timer']];
  const left = T.end ? Math.max(0, Math.ceil((T.end - Date.now()) / 1000)) : -1;
  const txt = left >= 0 ? pad2(Math.floor(left / 60)) + ':' + pad2(left % 60) : '--:--';
  const pct = left >= 0 && T.total ? (100 - left / T.total * 100).toFixed(1) + '%' : '0';
  pairs.forEach(([dSel, bSel, boxSel]) => {
    const el = $(dSel), bar = $(bSel), box = $(boxSel); if (!el) return;
    el.textContent = txt;
    if (bar) bar.style.width = pct;
    if (left < 0) box.classList.remove('run'); else box.classList.add('run');
  });
  if (left === 0) {
    clearInterval(T.int); T.end = 0; beep();
    try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) {}
    pairs.forEach(([, , boxSel]) => { const b = $(boxSel); if (b) b.classList.add('ring'); });
    setTimeout(() => { pairs.forEach(([, , boxSel]) => { const b = $(boxSel); if (b) b.classList.remove('ring'); }); paintTimer(); }, 2500);
    toast('המנוחה נגמרה. לסט הבא');
  }
}
function autoRest(inputId, value) {
  const m = inputId.match(/^lg-(.+)-(\d+)-([wr])$/); if (!m) return;
  const it = findItem(m[1]); if (!it || !it.log) return;
  if ((it.log === 't') !== (m[3] === 'w')) return;
  if (!(num(value) > 0)) return;
  const d = dayById(S.logDay); const blk = d && d.blocks.find(b => b.items.includes(it));
  if (blk && it.ss) { const i = blk.items.indexOf(it); const nx = blk.items[i + 1]; if (nx && nx.ss === it.ss) return; }
  startTimer(restSecs(it.rest));
}

function niceTicks(min, max, n) {
  const span = max - min, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = (f >= 5 ? 10 : f >= 2 ? 5 : f >= 1 ? 2 : 1) * mag;
  const out = []; for (let v = Math.floor(min / step) * step; v <= max + step * 0.001; v += step) out.push(+v.toFixed(6));
  return out;
}
function lineChart(host, pts, unit) {
  if (pts.length < 2) { host.innerHTML = `<p class="empty" dir="rtl">הגרף יופיע אחרי שתי מדידות לפחות.</p>`; return; }
  const W = Math.max(280, host.clientWidth || 600), H = 210, L = 44, R = 56, T = 14, B = 28;
  const ts = pts.map(p => +new Date(p.t)), vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs); if (lo === hi) { lo -= 1; hi += 1; }
  const padv = (hi - lo) * 0.18; const ticks = niceTicks(lo - padv, hi + padv, 4);
  lo = ticks[0]; hi = ticks[ticks.length - 1];
  const t0 = ts[0], t1 = ts[ts.length - 1] === t0 ? t0 + 1 : ts[ts.length - 1];
  const X = (t) => L + (t - t0) / (t1 - t0) * (W - L - R), Y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(ts[i]).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const area = line + ` L${X(ts[ts.length - 1]).toFixed(1)} ${H - B} L${X(ts[0]).toFixed(1)} ${H - B} Z`;
  const xl = [0, pts.length - 1]; if (W > 520 && pts.length > 4) xl.splice(1, 0, Math.floor((pts.length - 1) / 2));
  const last = pts[pts.length - 1];
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="גרף">
    ${ticks.map(v => `<line class="ch-grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ch-axis" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${fx(v, 1)}</text>`).join('')}
    ${xl.map(i => `<text class="ch-axis" x="${X(ts[i])}" y="${H - 8}" text-anchor="middle">${fmtD(pts[i].t).slice(0, 5)}</text>`).join('')}
    <path class="ch-area" d="${area}"/><path class="ch-line" d="${line}"/>
    <circle class="ch-dot" cx="${X(ts[ts.length - 1])}" cy="${Y(last.v)}" r="4.5"/>
    <text class="ch-end" x="${X(ts[ts.length - 1]) + 9}" y="${Y(last.v) + 4}">${fx(last.v, 1)}</text>
    <line class="ch-cross" id="cx" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
    <circle class="ch-dot" id="cd" r="5" cx="0" cy="0" visibility="hidden"/>
    <rect class="ch-hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/>
  </svg><div class="tip" hidden></div>`;
  const svg = $('svg', host), tip = $('.tip', host), cx = $('#cx', host), cd = $('#cd', host);
  const hide = () => { tip.hidden = true; cx.setAttribute('visibility', 'hidden'); cd.setAttribute('visibility', 'hidden'); };
  $('.ch-hit', host).addEventListener('pointermove', (e) => {
    const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) * (W / r.width);
    let bi = 0, bd = 1e9; ts.forEach((t, i) => { const d = Math.abs(X(t) - x); if (d < bd) { bd = d; bi = i; } });
    const px = X(ts[bi]), py = Y(pts[bi].v);
    cx.setAttribute('x1', px); cx.setAttribute('x2', px); cx.setAttribute('visibility', 'visible');
    cd.setAttribute('cx', px); cd.setAttribute('cy', py); cd.setAttribute('visibility', 'visible');
    tip.textContent = fmtD(pts[bi].t) + '  ' + fx(pts[bi].v, 1) + ' ' + unit + (pts[bi].note ? '  ' + pts[bi].note : '');
    tip.style.left = (px * r.width / W) + 'px'; tip.style.top = (py * r.height / H) + 'px'; tip.hidden = false;
  });
  $('.ch-hit', host).addEventListener('pointerleave', hide);
}
function e1rm(w, r) { return w * (1 + r / 30); }
function liftSeries(exId) {

}

/* ───────────── NAV + EVENTS ───────────── */
function go(tab, push = true) {
  if (!$('#tab-' + tab)) tab = 'program';
  S.tab = tab;
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $$('section.tab').forEach(s => { s.hidden = s.id !== 'tab-' + tab; });
  if (tab === 'progress') renderProgress();
  if (tab === 'coach') renderCoach();
  try { localStorage.setItem('atg-tab', tab); } catch (e) {}
  if (push) window.scrollTo({ top: 0 });
}
function applyUI(v, save = true) {
  const r = document.documentElement;
  if (v === 'light' || v === 'dark') r.setAttribute('data-ui', v); else { r.removeAttribute('data-ui'); v = 'auto'; }
  $$('[data-ui-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.uiSet === v)));
  if (save) { try { localStorage.setItem('atg-ui', v); } catch (e) {} }
}
document.addEventListener('pointerdown', ensureAudio, { passive: true });
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab],[data-act],[data-ui-set]'); if (!t) return;
  if (t.dataset.uiSet) { applyUI(t.dataset.uiSet); return; }
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  const a = t.dataset.act, id = t.dataset.id;
  if (a === 'day') { S.dayView = id; renderProgram(); }
  else if (a === 'logthis') { S.logDay = id; S.logDate = today(); S.dirty.log = false; renderLogForm(); go('log'); }
  else if (a === 't-start' || a === 'pt-start') { startTimer(+t.dataset.s); }
  else if (a === 't-stop' || a === 'pt-stop') { stopTimer(); }
  else if (a === 'savelog') { t.disabled = true; await saveLog(); t.disabled = false; }
  else if (a === 'editlog') { const w = S.workouts.find(x => x.id === id); if (w) { S.logDay = w.day; S.logDate = w.date; S.dirty.log = false; renderLogForm(); window.scrollTo({ top: 0 }); } }
  else if (a === 'saveci') { t.disabled = true; await saveCi(); t.disabled = false; }
  else if (a === 'editci') { S.ciDate = id; S.dirty.ci = false; renderCiForm(); window.scrollTo({ top: 0 }); }
  else if (a === 'savelab') { t.disabled = true; await saveLab(); t.disabled = false; }
  else if (a === 'editlab') { S.labDate = id; S.dirty.lab = false; renderLabForm(); $('#lab-form').scrollIntoView({ block: 'start' }); }
  else if (a === 'rmphoto') {
    if (S.ciNewPhotos.includes(id)) { S.ciNewPhotos = S.ciNewPhotos.filter(x => x !== id); if (S.assets) S.assets.delete(id).catch(() => {}); }
    else S.ciPhotos = S.ciPhotos.filter(x => x !== id);
    S.dirty.ci = true; drawCiPhotos();
  }
  else if (a === 'del') {
    const key = t.dataset.col + '/' + id;
    if (S.armed !== key) { S.armed = key; renderLogHist(); clearTimeout(S._arm); S._arm = setTimeout(() => { S.armed = null; renderLogHist(); }, 4000); return; }
    S.armed = null;
    try { await S.db.doc(key).delete(); toast('נמחק'); } catch (err) { toast('המחיקה נכשלה'); }
  }
  else if (a === 'copy') {
    const txt = $('#summary').value;
    try { await navigator.clipboard.writeText(txt); toast('הסיכום הועתק'); } catch (err) { $('#summary').select(); toast('סמן והעתק ידנית'); }
  }
});
document.addEventListener('input', (e) => {
  const id = e.target.id || e.target.name || '';
  if (id.startsWith('lg-') && id !== 'lg-date' && id !== 'lg-day') {
    S.dirty.log = true;
    if (/-[wr]$/.test(id)) { clearTimeout(S._rest); const v = e.target.value; S._rest = setTimeout(() => autoRest(id, v), 1200); }
    if (S.db) { clearTimeout(S._auto); const st = $('#autosave'); if (st) st.textContent = 'שומר…'; S._auto = setTimeout(() => saveLog(true), 2500); }
  }

  if (e.target.id === 'ci-blood') $('#ci-blood-alert').hidden = !e.target.checked;

document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'lg-day' || id === 'lg-date') { clearTimeout(S._auto); S.logDay = $('#lg-day').value; S.logDate = $('#lg-date').value || today(); S.dirty.log = false; renderLogForm(); }

});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === 'progress') renderProgress(); }, 150); });

/* ───────────── BOOT ───────────── */
(function initUI() { let v = 'auto'; try { v = localStorage.getItem('atg-ui') || 'auto'; } catch (e) {} applyUI(v, false); })();
renderAll();
(function initTab() {
  let t = (location.hash || '').slice(1);
  if (!t) { try { t = localStorage.getItem('atg-tab') || ''; } catch (e) {} }
  go(t || 'program', false);
})();

(async function connect() {
  const C = window.claude;
  if (!C || !C.use) { setSync('off'); return; }
  let db = null;
  try { db = await C.use('db'); } catch (e) { db = null; }
  if (!db) { setSync('off'); renderAll(); return; }
  S.db = db; setSync('on');
  try { S.assets = await C.use('assets'); } catch (e) { S.assets = null; }
  const docsOf = (snap) => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const onErr = (e) => { if (e && e.code === 'revoked') { S.db = null; setSync('off'); } };
  db.doc('program/current').onSnapshot(s => {
    if (s.exists) {
      const d = s.data(); if (d && Array.isArray(d.days) && d.days.length && (d.version || 0) >= (DEFAULT_PROGRAM.version || 0)) S.program = d;
      renderProgram(); renderFood(); renderLabSched();
      if (!S.dirty.log) renderLogForm();
      if (S.tab === 'coach') renderCoach();
      if (S.tab === 'progress') renderProgress();
    }
  }, onErr);
  db.collection('workouts').orderBy('date', 'desc').limit(400).onSnapshot(snap => {
    S.workouts = docsOf(snap).sort((a, b) => (b.date + (b.savedAt || '')).localeCompare(a.date + (a.savedAt || '')));
    renderProgram(); renderLogHist(); if (!S.dirty.log) renderLogForm();
    if (S.tab === 'progress') renderProgress(); if (S.tab === 'coach') renderCoach();
  }, onErr);
  db.collection('checkins').orderBy('date', 'desc').limit(300).onSnapshot(snap => {
    S.checkins = docsOf(snap); renderCiHist(); if (!S.dirty.ci) renderCiForm();
    if (S.tab === 'progress') renderProgress(); if (S.tab === 'coach') renderCoach();
  }, onErr);
  db.collection('reviews').limit(200).onSnapshot(snap => {
    S.reviews = docsOf(snap); renderLogHist(); if (!S.dirty.log) renderLogForm();
  }, onErr);
  db.collection('labs').orderBy('date', 'desc').limit(200).onSnapshot(snap => {
    S.labs = docsOf(snap); renderLabHist(); renderLabSched(); if (!S.dirty.lab) renderLabForm();
    if (S.tab === 'coach') renderCoach();
  }, onErr);
  renderAll();
})();
